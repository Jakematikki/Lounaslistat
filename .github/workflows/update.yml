name: Update lunch menus and deploy Pages

on:
  # Julkaise aina, kun main-haaraan pushataan muutoksia.
  push:
    branches:
      - main

  # Mahdollistaa käsin käynnistyksen:
  # Actions -> Update lunch menus and deploy Pages -> Run workflow
  workflow_dispatch:

  # Päivitä lounaslistat automaattisesti arkisin.
  # GitHub käyttää cronissa UTC-aikaa.
  # 06:00 UTC = Suomessa 08:00 talvella / 09:00 kesällä.
  schedule:
    - cron: "0 6 * * 1-5"


# GitHub Pages tarvitsee nämä oikeudet.
permissions:
  contents: read
  pages: write
  id-token: write


# Estetään useiden Pages-julkaisujen ajaminen yhtä aikaa.
concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:

  # -----------------------------------------------------------------------
  # BUILD
  #
  # 1. Hakee repon
  # 2. Asentaa Pythonin riippuvuudet
  # 3. Ajaa scraperit
  # 4. Luo site/data/lunch.json
  # 5. Pakkaa site/-hakemiston Pages-artifactiksi
  # -----------------------------------------------------------------------

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      - name: Fetch lunch menus
        run: |
          python main_scraper.py


      # Tämä ei ole pakollinen, mutta on hyödyllinen:
      # workflow kaatuu selkeästi jos scraperi ei tuottanut tiedostoa.
      - name: Verify generated lunch data
        run: |
          test -f site/data/lunch.json
          echo "Generated lunch.json:"
          cat site/data/lunch.json


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site


  # -----------------------------------------------------------------------
  # DEPLOY
  #
  # Julkaisee build-jobin tekemän Pages-artifactin.
  # -----------------------------------------------------------------------

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
