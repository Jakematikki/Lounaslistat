name: Update lunch menus and deploy Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 1-5"


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Show repository contents
        run: |
          echo "Repository root:"
          pwd
          find . -maxdepth 3 -type f | sort


      - name: Verify index.html exists
        run: |
          test -f site/index.html
          echo "site/index.html found"


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      - name: Run lunch scrapers
        run: |
          python main_scraper.py


      - name: Verify complete site
        run: |
          echo "Files that will be published:"
          find site -maxdepth 3 -type f | sort

          echo ""
          echo "Checking required files:"

          test -f site/index.html
          test -f site/app.js
          test -f site/style.css
          test -f site/data/lunch.json

          echo ""
          echo "Everything required exists."


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
