name: Update lunch menus and deploy Pages

on:
  #push:
   # branches:
    #  - main

  workflow_dispatch:

  schedule:
    - cron: "40 9 * * 1-5"
      timezone: "Europe/Helsinki"

permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Show repository contents
        run: |
          echo "Repository contents:"
          find . -maxdepth 4 -type f | sort


      - name: Verify index.html
        run: |
          test -f site/index.html
          echo "site/index.html found"


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      - name: Run lunch scrapers
        run: |
          python main_scraper.py


      - name: Verify site files
        run: |
          echo "Files to be published:"
          find site -maxdepth 4 -type f | sort

          test -f site/index.html
          test -f site/app.js
          test -f site/style.css
          test -f site/data/lunch.json

          echo "All required files found."


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site


  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
