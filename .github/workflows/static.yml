name: Update lunch menus and deploy Pages

on:
  # Aja aina kun main-haaraan pushataan muutoksia
  push:
    branches: ["main"]

  # Mahdollistaa käsin käynnistyksen Actions-välilehdeltä
  workflow_dispatch:

  # Päivitä lounaslistat automaattisesti arkisin
  # Cron käyttää UTC-aikaa
  schedule:
    - cron: "0 6 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run lunch scrapers
        run: |
          python main_scraper.py

      - name: Verify generated files
        run: |
          echo "Contents of site:"
          find site -maxdepth 3 -type f

          echo ""
          echo "Generated lunch.json:"
          cat site/data/lunch.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
